<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TS Modules Demo</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="header" id="top">
    <h1>TypeScript Modules</h1>
    <button id="openModalBtn" class="btn">Відкрити модалку</button>
</header>

<main class="container">
    <section>
        <h2>Пости (JSONPlaceholder)</h2>
        <button id="loadPostsBtn" class="btn">Завантажити пости</button>
        <ul id="postsList" class="posts"></ul>
    </section>

    <section>
        <h2>Скролл-анімація</h2>
        <div class="box animate-on-scroll">Я з’являюсь при скролі 👋</div>
        <div style="height: 800px"></div>
        <a href="#top" id="toTop" class="to-top">↑ До верху</a>
    </section>
</main>

<div id="modal" class="modal" aria-hidden="true">
    <div class="modal__dialog">
        <h3>Привіт з модалки</h3>
        <p>Модальне вікно, кероване з модуля.</p>
        <button id="closeModalBtn" class="btn btn--secondary">Закрити</button>
    </div>
</div>

<!-- головний файл як ES module -->
<script type="module" src="dist/main.js" defer></script>
</body>
</html>
